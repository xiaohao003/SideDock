name: Windows Build

on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows-build.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # 打 tag 时创建 Release 并挂资产

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tag 触发时读 tag message 作 Release 正文(fetch-tags 与浅克隆的 refspec 冲突)

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Run tests
        run: cargo test --release

      - name: Build release exe
        run: cargo build --release

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*" -Filter ISCC.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName
          & $iscc installer.iss
          if (-not (Test-Path "dist/SideDock-windows-setup.exe")) { throw "installer not produced" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/SideDock.exe dist/
          Compress-Archive -Path dist/SideDock.exe -DestinationPath SideDock-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideDock-windows-x64
          path: |
            SideDock-windows-x64.zip
            windows/dist/SideDock-windows-setup.exe
          retention-days: 30

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: git tag -l "${env:GITHUB_REF_NAME}" -n200 | tail -n +2 | sed 's/^[[:space:]]*//' > release-notes.md
        shell: bash

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            windows/SideDock-windows-x64.zip
            windows/dist/SideDock-windows-setup.exe
