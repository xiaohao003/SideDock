name: Windows Build

on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows-build.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # 打 tag 时创建 Release 并挂资产

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tag 触发时读 tag message 作 Release 正文(fetch-tags 与浅克隆的 refspec 冲突)

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Run tests
        run: cargo test --release

      - name: Build release exe
        run: cargo build --release

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer | Out-Null
          # 中文向导文件(Inno 6.3+ 官方语言目录)下载到 installer/(目录需先建)
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile "installer/ChineseSimplified.isl"
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) {
            # choco 社区源近期不稳定:改用官方安装器静默安装
            $exe = "$env:TEMP\innosetup.exe"
            Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -UserAgent "github-actions" -MaximumRedirection 10 -OutFile $exe
            $p = Start-Process -FilePath $exe -ArgumentList "/SILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
            Write-Output "innosetup installer exit: $($p.ExitCode)"
            $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          Write-Output "ISCC: $iscc"
          & $iscc installer.iss
          if (-not (Test-Path "dist/SideDock-windows-setup.exe")) { throw "installer not produced" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/SideDock.exe dist/
          Compress-Archive -Path dist/SideDock.exe -DestinationPath SideDock-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideDock-windows-x64
          path: |
            windows/SideDock-windows-x64.zip
            windows/dist/SideDock-windows-setup.exe
          retention-days: 30

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: git tag -l "${env:GITHUB_REF_NAME}" -n200 | tail -n +2 | sed 's/^[[:space:]]*//' > release-notes.md
        shell: bash

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            windows/SideDock-windows-x64.zip
            windows/dist/SideDock-windows-setup.exe
