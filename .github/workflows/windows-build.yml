name: Windows Build

on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Run tests
        run: cargo test --release

      - name: Build release exe
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/SideDock.exe dist/
          Compress-Archive -Path dist/SideDock.exe -DestinationPath SideDock-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideDock-windows-x64
          path: windows/SideDock-windows-x64.zip
          retention-days: 30
