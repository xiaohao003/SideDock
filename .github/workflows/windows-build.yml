name: Windows Build (Electron)

# v1.2.0 起 Windows 版为 Electron 实现(windows-electron/);旧 Rust 版(windows/)保留但不再构建
on:
  push:
    branches: [main]
    paths: ["windows-electron/**", ".github/workflows/windows-build.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # 打 tag 时创建 Release 并挂资产

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-electron
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tag 触发时读 tag message 作 Release 正文

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows-electron/package-lock.json

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Run tests
        run: npm test

      - name: Build installer (NSIS) + zip
        run: npx electron-builder --win nsis zip --publish never
        env:
          # 未签名:跳过代码签名检测
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify outputs
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/SideDock-windows-setup.exe")) { throw "installer not produced" }
          if (-not (Test-Path "dist/SideDock-windows-x64.zip")) { throw "zip not produced" }
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideDock-windows-x64
          path: |
            windows-electron/dist/SideDock-windows-setup.exe
            windows-electron/dist/SideDock-windows-x64.zip
          retention-days: 30

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: git tag -l "${env:GITHUB_REF_NAME}" -n200 | tail -n +2 | sed 's/^[[:space:]]*//' > release-notes.md
        shell: bash

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            windows-electron/dist/SideDock-windows-setup.exe
            windows-electron/dist/SideDock-windows-x64.zip
