name: Windows Build

on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows-build.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # 打 tag 时创建 Release 并挂资产

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true # tag 触发时要能读到 tag message 作为 Release 正文

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Run tests
        run: cargo test --release

      - name: Build release exe
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/SideDock.exe dist/
          Compress-Archive -Path dist/SideDock.exe -DestinationPath SideDock-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideDock-windows-x64
          path: windows/SideDock-windows-x64.zip
          retention-days: 30

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: git tag -l "${env:GITHUB_REF_NAME}" -n200 | tail -n +2 | sed 's/^[[:space:]]*//' > release-notes.md
        shell: bash

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: windows/SideDock-windows-x64.zip
