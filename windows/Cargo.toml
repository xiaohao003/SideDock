[package]
name = "sidedock"
version = "1.1.10"
edition = "2021"
description = "SideDock for Windows 鈥?妗岄潰渚ц竟鏍?寰呭姙/绗旇/涓嬭浇/鏆傚瓨/瀵嗙爜/鍓创鏉?"
license = "MIT"

[[bin]]
name = "SideDock"
path = "src/main.rs"

[build-dependencies]
# 浠?Windows 鏋勫缓闇€瑕?璧勬簮宓屽叆);cfg 闂ㄦ帶閬垮厤闈?Windows 骞冲彴寮曞叆
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dependencies]
eframe = { version = "0.32", default-features = true, features = ["wgpu"] } # wgpu 澶囬€夊悗绔?鐧藉睆鏈哄櫒鍙?SIDEDOCK_RENDERER=wgpu 鍒囨崲)
egui = "0.32"
arboard = "3.4"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
base64 = "0.22"
dirs = "5"

# Windows 涓撳睘渚濊禆(闈?Windows 骞冲彴缂栬瘧鏃惰嚜鍔ㄨ烦杩?閫昏緫灞傝蛋 platform 妯″潡鐨勬浛韬疄鐜?
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
global-hotkey = "0.6"
tray-icon = "0.19"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Dwm",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_Security_Cryptography",
    "Media_Control",
    "Storage_Streams",
    "Foundation",
] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
